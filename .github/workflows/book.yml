name: Build book

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::bookdown
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::dplyr
            any::tidyr
            any::tibble
            any::readr
            any::scales
            any::kableExtra
            any::DiagrammeR
            any::visNetwork
            any::DT
            any::igraph
            any::ggraph
            any::ggrepel
            any::patchwork
            any::yaml
            any::bslib
            any::downlit
            any::xml2
            any::ragg
            any::htmltools
            any::stringr
            any::purrr
            any::forcats

      - name: Merge bibliography
        run: Rscript tools/merge_bib.R

      - name: Render book
        run: Rscript -e 'bookdown::render_book("index.Rmd", "bookdown::bs4_book", quiet = TRUE)'

      - name: Share images, atlas, sitemap
        run: |
          mkdir -p docs/images
          cp images/social-card.png images/cover.png images/apple-touch-icon.png docs/images/
          cp data/theory-atlas.csv docs/theory-atlas.csv
          Rscript tools/postprocess_html.R docs
          Rscript generate_sitemap.R

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs

  deploy-pages:
    # Enable by setting the repository variable DEPLOY_PAGES=true and choosing
    # "GitHub Actions" as the Pages source (Settings -> Pages).
    if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
