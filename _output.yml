bookdown::bs4_book:
  repo:
    base: https://github.com/mikenguyen13/social-theory
    branch: master
  css: style.css
  includes:
    in_header: [google_analytics.html]
  theme:
    version: 4
    primary: "#1f4e79"
    fg: "#1b1b1b"
    bg: "#ffffff"
    base_font:
      google: "Source Serif 4"
    heading_font:
      google:
        family: "Inter"
        wght: [500, 600, 700]
    code_font:
      google: "JetBrains Mono"
  footnotes_inline: true
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: default
  keep_tex: yes
  toc_depth: 2
  pandoc_args: ["--lua-filter=tools/callouts.lua"]
bookdown::epub_book:
  stylesheet: style.css
  pandoc_args: ["--lua-filter=tools/callouts.lua"]
